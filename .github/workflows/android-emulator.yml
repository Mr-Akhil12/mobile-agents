name: Android real-model emulator validation
on:
  push:
    branches: ['feature/emulator-validation']
  pull_request:
    paths: ['app/**', 'inference-native/**', 'scripts/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emulator-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned build toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Verify source pins and build real x86_64 JNI/test APKs
        run: |
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = 522021325546ea322b0b1e58a50f9dbf03a5f197
          sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --no-daemon -PlfmAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Fetch and verify actual model into temporary runner storage
        run: python3 scripts/fetch-validation-model.py "$RUNNER_TEMP/lfm-validation.gguf"
      - name: Enable accelerated emulator access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run actual Android UI/JNI/model/tool/history checks offline
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          heap-size: 512M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-emulator-validation.sh "$RUNNER_TEMP/lfm-validation.gguf"
      - name: Keep compact evidence and generated lockfiles; never weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emulator-evidence-${{ github.run_id }}
          retention-days: 3
          path: |
            validation-evidence/
            app/gradle.lockfile
            inference-native/gradle.lockfile
            settings-gradle.lockfile
      - name: Remove temporary model fixture
        if: always()
        run: rm -f "$RUNNER_TEMP/lfm-validation.gguf"
